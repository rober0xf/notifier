version: "2"

linters:
  default: none

  enable:
    - staticcheck

  settings:
    staticcheck:
      checks:
        - all
        - -SA9003
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
        - -SA1019

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
